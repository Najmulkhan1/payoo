<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <!-- daisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <!-- tailwindcss cdn -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>

    <!-- font awesome cdn -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
      integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="bg-[#F4F5F7] min-h-[100vh]">
    <!-- navbar -->
    <div class="bg-white rounded-b-xl max-w-lg mx-auto p-3">
      <div class="border-b-1 border-gray-300 flex justify-between items-center">
        <div class="flex">
          <img src="./assets/Group.png" alt="" class="h-[50px]" />
          <div class="ml-3">
            <h2 class="font-bold">$<span id="avaible-balance">5000</span></h2>
            <p class="text-[#08080880]">Available Balance</p>
          </div>
        </div>

        <div>
          <button class="btn text-[#08080880] border-3">
            <i class="fa-solid fa-arrow-right-from-bracket rotate-180"></i>Log
            Out
          </button>
        </div>
      </div>

      <div class="mt-[30px]">
        <div>
          <h1 class="text-[24px] font-bold">🔥 Welcome to Payooo!</h1>
          <p class="text-[#08080880]">
            Enjoy easy and convenient financial services with us. Cashout charge
            is low and
          </p>
        </div>

        <!-- category -->
        <div class="mt-4 min-h-[200px] grid grid-cols-3 gap-4">
          <div class="border-1 border-gray-300 flex justify-center items-center text-center p-3 rounded-lg" id="add-money-cta-btn">
            <div>
                <img src="./assets/wallet1.png" alt="" class="mx-auto" />
                <h2>Add Money</h2>
            </div>
          </div>

          <div class="border-1 border-gray-300 flex items-center justify-center text-center p-3 rounded-lg" id="cash-out-cta-btn">
            <div>
                <img src="./assets/send1.png" alt="" class="mx-auto" />
            <h2>Cashout</h2>
            </div>
            
          </div>
          <div class="border-1 border-gray-300 text-center p-3 rounded-lg flex items-center justify-center">
            <div>
                 <img src="./assets/money1.png" alt="" class="mx-auto" />
            <h2>Transfer Money</h2>
            </div>
           
          </div>
          <div class="border-1 border-gray-300 text-center p-3 rounded-lg flex justify-center items-center">
            <div>
                <img src="./assets/bonus1.png" alt="" class="mx-auto" />
            <h2>Get Bonus</h2>
            </div>
            
          </div>
          <div class="border-1 border-gray-300 text-center p-3 rounded-lg flex justify-center items-center">'
            <div>
               <img src="./assets/purse1.png" alt="" class="mx-auto" />
            <h2>Pay Bill</h2> 
            </div>
            
          </div>
          <div class="border-1 border-gray-300 text-center p-3 rounded-lg flex justify-center items-center">
            <div>
                <img src="./assets/transaction1.png" alt="" class="mx-auto" />
            <h2>Transactions</h2>
            </div>
            
          </div>
        </div>
      </div>
    </div>

    <div class="all-form--sections max-w-lg mx-auto">
      <!-- add money -->
      <div id="add-money-parent" >
        <h1 class="my-4 font-bold">Add Money</h1>
        <form id="myFrom" action="" class="bg-white rounded-4xl p-8 mt-4">
          <div>
            <h1 class="font-semibold">Select A Bank</h1>
            <select id="bank" class="select w-full h-12 bg-[#F4F5F7] mt-3 rounded-2xl">
              <option value="">Pick a Bank</option>
              <option value="ab bank">Ab Bank</option>
              <option value="national bank">National Bank</option>
              <option value="jonota bank">Jonota Bank</option>
            </select>
          </div>
          <div class="mt-2">
            <label for="" class="font-semibold">Bank Account Number</label> <br>
            <input id="bank-account-num" type="text" placeholder="Enter 11 digit account number" class="input bg-[#F4F5F7] mt-3 rounded-2xl w-full h-12" />
          </div>
          <div class="mt-2">
            <label for="" class="font-semibold">Amount to Add</label> <br>
            <input id="add-amount" type="text" placeholder="Add Amount to withdraw" class="input bg-[#F4F5F7] mt-3 rounded-2xl w-full h-12" />
          </div>
          <div  class="mt-2">
            <label for="" class="font-semibold">Pin Number</label> <br>
            <input id="pin-num" type="text" placeholder="Enter 4 Digit Pin" class="input bg-[#F4F5F7] mt-3 rounded-2xl w-full h-12" />
          </div>

           <button id="add-money-btn" class="btn bg-[#0874F2] text-white mt-5 h-12 w-full rounded-2xl">Add Money</button>
        </form>
      </div>

      <!-- cash out -->
       <div id="cashout-parent" style="display: none;">
        <h1 class="my-4 font-bold">cash out</h1>
         <form id="myFrom" action="" class="bg-white rounded-4xl p-8 mt-4">
          <div class="mt-2">
            <label for="" class="font-semibold">User Account Number </label> <br>
            <input id="bank-account-num" type="text" placeholder="Enter 11 digit account number" class="input bg-[#F4F5F7] mt-3 rounded-2xl w-full h-12" />
          </div>
          <div class="mt-2">
            <label for="" class="font-semibold">Amount</label> <br>
            <input id="add-amount" type="text" placeholder="Enter amount to withdraw" class="input bg-[#F4F5F7] mt-3 rounded-2xl w-full h-12" />
          </div>
          <div  class="mt-2">
            <label for="" class="font-semibold">Pin Number</label> <br>
            <input id="pin-num" type="text" placeholder="Enter 4 Digit Pin" class="input bg-[#F4F5F7] mt-3 rounded-2xl w-full h-12" />
          </div>

           <button id="withdraw-btn" class="btn bg-[#0874F2] text-white mt-5 h-12 w-full rounded-2xl">Withdraw Money</button>
        </form>
       </div>


    </div>


    <script src="./home.js"></script>
  </body>
</html>
