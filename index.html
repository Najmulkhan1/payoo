<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paynoora</title>
    <!-- daisyUI -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <!-- tailwindcss cdn -->
      
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @theme {
        --color-clifford: #da373d;
      }
    </style>
</head>
<body class="bg-[#F4F5F7] h-[100vh] flex flex-col justify-center items-center">
    <div class="h-[130px] w-[300px]  bg-[url(./assets/bg.png)] bg-cover flex justify-center items-center">
        <img src="./assets/Group.png" alt="">
    </div>
    <form class="bg-white p-8 rounded-2xl w-[350px]">
        <div>
            <label for="" class="font-semibold">Mobile Number</label> <br>
            <input id="num-input" type="text" placeholder="Enter your number" class="input bg-[#F4F5F7] mt-3 rounded-2xl" />
        </div>
        <div class="mt-5">
            <label for="" class="font-semibold"> 4 Digit Pin</label> <br>
            <input id="pin-input" type="text" placeholder="Enter 4 Digit Pin" class="input bg-[#F4F5F7] mt-3 rounded-2xl" />
        </div>
        <button id="login-btn" class="btn bg-[#0874F2] text-white mt-5 w-full rounded-2xl">Login</button>
    </form>


    <script src="./script.js"></script>

</body>
</html>
